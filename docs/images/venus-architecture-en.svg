<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2050" viewBox="0 0 1800 2050" role="img" aria-labelledby="title desc"><title id="title">Venus Program Architecture</title><desc id="desc">Architecture: local Markdown enters Vault, processing generates AI knowledge, AI skills and concepts, persisted with source references for viewing and editing. Incremental local change detection skips unchanged complete content without repeated semantic review. Runtime activity and actual token usage are displayed. When only final usage is available, rate is shown as a recent-request average.</desc><rect width="1800" height="2050" fill="#f6f8fc"/><text x="80" y="98.14" font-family="DejaVu Sans,Arial,sans-serif" font-size="58" font-weight="700" fill="#17263b">Venus Program Architecture</text><text x="82" y="157.24" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400" fill="#526178">Local sources → knowledge, skills and concepts → traceable views and editing</text><rect x="80" y="215" width="410" height="175" rx="22" fill="#ffffff" stroke="#d8e0ec" stroke-width="2"/><rect x="102" y="240" width="7" height="125" rx="3" fill="#355fd6"/><text x="130" y="270.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Local sources</text><text x="130" y="322.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Markdown files / imports</text><text x="130" y="365.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Current content + edits</text><rect x="565" y="215" width="580" height="175" rx="22" fill="#ffffff" stroke="#d8e0ec" stroke-width="2"/><rect x="587" y="240" width="7" height="125" rx="3" fill="#355fd6"/><text x="615" y="270.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Vault · source repository</text><text x="615" y="322.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Source text + searchable index</text><rect x="1220" y="215" width="500" height="175" rx="22" fill="#edf2ff" stroke="#d8e0ec" stroke-width="2"/><rect x="1242" y="240" width="7" height="125" rx="3" fill="#355fd6"/><text x="1270" y="270.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Configured AI</text><text x="1270" y="322.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">GPT / Claude / Gemini</text><text x="1270" y="365.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">or a local model</text><polyline points="490,302 565,302" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="565,302 553.5914266954252,308.2325320018546 553.5914266954252,295.7674679981454" fill="#7c8ba1"/><rect x="565" y="450" width="580" height="180" rx="22" fill="#ffffff" stroke="#d8e0ec" stroke-width="2"/><rect x="587" y="475" width="7" height="130" rx="3" fill="#355fd6"/><text x="615" y="505.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Processing &amp; scheduling</text><text x="615" y="557.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Segments · checkpoints</text><text x="615" y="600.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Extraction and inference</text><polyline points="855,390 855,450" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="855,450 848.7674679981453,438.5914266954252 861.2325320018547,438.5914266954251" fill="#7c8ba1"/><polyline points="1470,390 1470,540 1145,540" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="1145,540 1156.408573304575,533.7674679981453 1156.408573304575,546.2325320018547" fill="#7c8ba1"/><text x="1225" y="439.92" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#526178">AI assistance</text><rect x="80" y="720" width="520" height="210" rx="22" fill="#eff7f5" stroke="#d8e0ec" stroke-width="2"/><rect x="102" y="745" width="7" height="160" rx="3" fill="#258675"/><text x="130" y="775.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">AI knowledge</text><text x="130" y="827.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Retrievable facts</text><text x="130" y="870.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">What the sources say</text><rect x="640" y="720" width="520" height="210" rx="22" fill="#eff7f5" stroke="#d8e0ec" stroke-width="2"/><rect x="662" y="745" width="7" height="160" rx="3" fill="#258675"/><text x="690" y="775.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">AI skills</text><text x="690" y="827.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Methods and constraints</text><text x="690" y="870.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">How to act; rules to follow</text><rect x="1200" y="720" width="520" height="210" rx="22" fill="#eff7f5" stroke="#d8e0ec" stroke-width="2"/><rect x="1222" y="745" width="7" height="160" rx="3" fill="#258675"/><text x="1250" y="775.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Concept cloud</text><text x="1250" y="827.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Derived directly from Vault</text><text x="1250" y="870.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">What it is · why · effects</text><polyline points="855,630 855,674" fill="none" stroke="#7c8ba1" stroke-width="4"/><polyline points="855,674 340,674 340,720" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="340,720 333.7674679981454,708.5914266954252 346.2325320018546,708.5914266954252" fill="#7c8ba1"/><polyline points="855,674 900,674 900,720" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="900,720 893.7674679981453,708.5914266954252 906.2325320018547,708.5914266954252" fill="#7c8ba1"/><polyline points="855,674 1460,674 1460,720" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="1460,720 1453.7674679981453,708.5914266954252 1466.2325320018547,708.5914266954252" fill="#7c8ba1"/><text x="82" y="665.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#526178">Three output types</text><polyline points="340,930 340,978 1460,978 1460,930" fill="none" stroke="#7c8ba1" stroke-width="4"/><polyline points="900,930 900,1020" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="900,1020 893.7674679981453,1008.5914266954252 906.2325320018547,1008.5914266954252" fill="#7c8ba1"/><rect x="390" y="1020" width="1020" height="155" rx="22" fill="#ffffff" stroke="#d8e0ec" stroke-width="2"/><rect x="412" y="1045" width="7" height="105" rx="3" fill="#355fd6"/><text x="440" y="1075.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Persistent files + source references</text><text x="440" y="1127.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Trace outputs back to source material; support continued processing</text><polyline points="900,1175 900,1225" fill="none" stroke="#7c8ba1" stroke-width="4"/><polygon points="900,1225 893.7674679981453,1213.591426695425 906.2325320018547,1213.591426695425" fill="#7c8ba1"/><rect x="390" y="1225" width="1020" height="155" rx="22" fill="#ffffff" stroke="#d8e0ec" stroke-width="2"/><rect x="412" y="1250" width="7" height="105" rx="3" fill="#355fd6"/><text x="440" y="1280.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">View &amp; edit</text><text x="440" y="1332.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Content directory · editor · four network views</text><text x="1440" y="1272.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#17263b">Animation</text><text x="1440" y="1316.58" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#526178">Local only</text><rect x="80" y="1440" width="1640" height="225" rx="22" fill="#eef2f7" stroke="#d8e0ec" stroke-width="2"/><rect x="102" y="1465" width="7" height="175" rx="3" fill="#667991"/><text x="130" y="1495.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Runtime feedback &amp; recovery</text><text x="130" y="1547.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Activity · progress · daily logs · exceptions · retry / skip / continue</text><text x="130" y="1590.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Actual token usage; rate shown as a recent-request average when only final usage is available.</text><rect x="80" y="1710" width="1640" height="220" rx="22" fill="#fff7e8" stroke="#d8e0ec" stroke-width="2"/><rect x="102" y="1735" width="7" height="170" rx="3" fill="#b77b19"/><text x="130" y="1765.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263b">Incremental processing · local change detection</text><text x="130" y="1817.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Unchanged + complete → skip; no model generation or repeated semantic review.</text><text x="130" y="1860.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Extract only new / changed / missing content. Validate write schema and references.</text><text x="130" y="1903.41" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#526178">Source references support traceability, not automatic semantic re-review.</text><text x="82" y="1992.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#526178">Scope: no external web fact-checking.</text><text x="900" y="1992.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#526178">Confirmed architecture; not a file dependency graph.</text></svg>
